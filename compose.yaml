
services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_dev_only
      POSTGRES_DB: jungle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    container_name: jungle-ministack
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      GATEWAY_PORT: 4566
      PERSIST_STATE: "1"
      STATE_DIR: /data
    volumes:
      - ministack_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ministack_data:
